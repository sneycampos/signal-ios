name: Signal
options:
  bundleIdPrefix: com.silviogodinho
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: "677L8TYNN9"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "3"

targets:
  SignalCore:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/SignalCore
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.silviogodinho.SignalCore"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CURRENT_PROJECT_VERSION: "3"
        MARKETING_VERSION: "1.1.0"

  SignalUI:
    type: framework
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/SignalUI
    dependencies:
      - target: SignalCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.silviogodinho.SignalUI"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CURRENT_PROJECT_VERSION: "3"
        MARKETING_VERSION: "1.1.0"

  Signal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/SignalApp
      - path: Resources
    dependencies:
      - target: SignalCore
      - target: SignalUI
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Mesh Planner
        CFBundleDevelopmentRegion: en
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSCameraUsageDescription: "Mesh Planner uses the camera and LiDAR scanner to scan your rooms and show Wi-Fi signal in augmented reality."
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiredDeviceCapabilities: [arm64, arkit]
        CFBundleDocumentTypes:
          - CFBundleTypeName: Mesh Planner Project
            LSHandlerRank: Owner
            LSItemContentTypes: [com.silviogodinho.signal.project]
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: com.silviogodinho.signal.project
            UTTypeDescription: Mesh Planner Project
            UTTypeConformsTo: [public.json, public.data]
            UTTypeTagSpecification:
              public.filename-extension: [signalsim]
              public.mime-type: [application/x-signalsim]
    settings:
      base:
        PRODUCT_NAME: "Signal"
        PRODUCT_BUNDLE_IDENTIFIER: "com.silviogodinho.signal"
        ASSETCATALOG_COMPILER_APPICON_NAME: "AppIcon"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_IDENTITY: "Apple Development"
        ENABLE_PREVIEWS: NO

  SignalUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Tests/SignalUITests
    dependencies:
      - target: Signal
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "com.silviogodinho.SignalUITests"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Signal

schemes:
  Signal:
    build:
      targets:
        Signal: all
  SignalUITests:
    build:
      targets:
        Signal: [test, run]
        SignalUITests: [test]
    test:
      targets:
        - SignalUITests
